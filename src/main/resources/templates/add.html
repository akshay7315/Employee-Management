<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Employee</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2d3436;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #2d3436;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .btn {
      width: 100%;
      background-color: #0984e3;
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #74b9ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add Employee</h2>
    <form th:action="@{/save}" th:object="${employee}" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" th:field="*{name}" placeholder="Enter full name" required/>

      <label for="city">City</label>
      <input type="text" id="city" th:field="*{city}" placeholder="Enter city" required/>

      <label for="designation">Designation</label>
      <input type="text" id="designation" th:field="*{designation}" placeholder="Enter designation" required/>

      <button type="submit" class="btn" >Add Employee</button>
    </form>
  </div>
</body>

</html>
