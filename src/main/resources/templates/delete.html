<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            background-color: #1976d2;
            transition: 0.3s ease;
            margin-right: 5px;
        }

        .btn:hover {
            background-color: #135ca1;
        }

        .btn-danger {
            background-color: #f44336;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        .btn-warning {
            background-color: #ff9800;
        }

        .btn-warning:hover {
            background-color: #e68a00;
        }

        .btn-view {
            background-color: #4caf50;
        }

        .btn-view:hover {
            background-color: #388e3c;
        }

        .btn-create {
            float: right;
            margin-bottom: 20px;
            background-color: #009688;
        }

        .btn-create:hover {
            background-color: #00796b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-buttons {
            display: flex;
        }

        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }

            .btn {
                margin-bottom: 5px;
            }

            .btn-create {
                float: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Employee Management System</h1>
</header>

<div class="container">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Designation</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employee}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.city}"></td>
                <td th:text="${emp.designation}"></td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{'/delete/' + ${emp.id}}" class="btn btn-danger" 
                           onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
